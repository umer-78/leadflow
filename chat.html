<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Chat with us</title>
  </head>
  <body>
    <div id="chat" class="chat" aria-busy="true">
      <header class="chat-header">
        <div class="chat-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="chat-title">
          <strong id="clinic-name">Loading…</strong>
          <span>Virtual assistant · replies instantly</span>
        </div>
        <button id="close" class="chat-close" type="button" aria-label="Close chat" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <main id="log" class="chat-log" role="log" aria-live="polite" aria-relevant="additions"></main>
      <div id="suggestions" class="chat-suggestions" role="group" aria-label="Suggested replies"></div>
      <form id="composer" class="chat-composer">
        <label for="input" class="sr-only">Type your message</label>
        <textarea id="input" rows="1" maxlength="1000" placeholder="Type your message…" autocomplete="off" disabled></textarea>
        <button id="send" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <footer class="chat-footer">Automated assistant, not medical advice. In an emergency call 911.</footer>
    </div>
    <script type="module" src="/client/chat/chat.ts"></script>
  </body>
</html>
