name: Site

# Checks the marketing site in docs/ (served by GitHub Pages) for broken links.
# Runs weekly too, to catch external links that rot.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/site.yml"]
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Absolute links to the live site are checked against the files in this
      # commit, so a new page doesn't fail before it is deployed.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --remap 'https://umer-78\.github\.io/leadflow/$ file://${{ github.workspace }}/docs/index.html'
            --remap 'https://umer-78\.github\.io/leadflow/(.+) file://${{ github.workspace }}/docs/$1'
            --exclude '^mailto:'
            --exclude '^https://fonts\.(googleapis|gstatic)\.com'
            'docs/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
