name: Keep-alive

# Pings the deployed app so a free Render instance (and its free database)
# doesn't go to sleep between visitors. Set the repository variable
# LEADFLOW_URL (Settings → Secrets and variables → Actions → Variables), e.g.
# https://leadflow.onrender.com; until then the job just says there's nothing
# to ping. GitHub runs schedules on a best-effort basis, so for a strict
# 5-minute ping also point a free uptime monitor at the same /api/health URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /api/health (app and database)
        env:
          URL: ${{ vars.LEADFLOW_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::Set the LEADFLOW_URL repository variable to keep the deployed app awake."
            exit 0
          fi
          curl -fsS --retry 10 --retry-delay 20 --retry-all-errors --retry-max-time 270 --max-time 60 "${URL%/}/api/health"
