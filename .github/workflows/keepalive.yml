name: Keep-alive

# Pings the deployed app so a sleeping host (like a free Render instance and its
# free database) stays awake, and so a broken deploy shows up as a failed run.
# It pings the AWS Lightsail server (see DEPLOY.md) unless the repository
# variable LEADFLOW_URL (Settings → Secrets and variables → Actions → Variables)
# points somewhere else. GitHub runs schedules on a best-effort basis, so for a strict
# 5-minute ping also point a free uptime monitor at the same /api/health URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /api/health (app and database)
        env:
          URL: ${{ vars.LEADFLOW_URL || 'https://184-195-78-153.sslip.io' }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::Set the LEADFLOW_URL repository variable to keep the deployed app awake."
            exit 0
          fi
          curl -fsS --retry 10 --retry-delay 20 --retry-all-errors --retry-max-time 270 --max-time 60 "${URL%/}/api/health"
