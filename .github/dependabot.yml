version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # CI and the server run Node 22: newer type majors would allow APIs it lacks
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Express 5 changes routing and error handling; moving to it is its own piece of work
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
    # Wait until a release has been out a while before proposing it.
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      vite:
        patterns: ["vite", "@vitejs/*", "@tailwindcss/*", "tailwindcss"]
      # Everything else that's only a patch release, in one PR.
      patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
