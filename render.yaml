# Deploy LeadFlow AI free on Render: a web service from the Dockerfile.
# Set GEMINI_API_KEY (free tier) and DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: leadflow
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
