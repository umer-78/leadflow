# Render blueprint: the LeadFlow web service plus a managed PostgreSQL database.
# Secrets marked `sync: false` are entered in the Render dashboard (never committed).
# See DEPLOY.md for the full runbook.
databases:
  - name: leadflow-db
    plan: free
    databaseName: leadflow
    user: leadflow

services:
  - type: web
    name: leadflow
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-db
          property: connectionString
      # Your public URL, e.g. https://leadflow.onrender.com (used in emails and the widget snippet).
      - key: PUBLIC_BASE_URL
        sync: false
      # Create the demo clinic (demo@leadflow.local / demo1234)? Leave false for real clinics.
      - key: SEED_DEMO
        value: "false"
      # Email delivery (optional): without these, emails are logged in the dashboard instead of sent.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Claude answers (optional): without a key the built-in assistant answers everything.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Stripe billing (optional).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
